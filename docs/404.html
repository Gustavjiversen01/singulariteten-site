:root { --paper: #FFFFFF; --ink: #000000; --muted: #555555; --soft: #9C9C9C; }
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px max(16px, env(safe-area-inset-right, 0px))
       32px max(16px, env(safe-area-inset-left, 0px)); font-family: "EB Garamond", Garamond, "Times New Roman", serif; font-size: 21px;
       line-height: 1.4; font-kerning: normal; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.nf { text-align: center; }
.mark { display: inline-block; line-height: 0; margin-bottom: 30px; }
.sc { font-variant-caps: all-small-caps; letter-spacing: .16em; font-weight: 600; }
.code { margin: 0 0 12px; font-size: 17px; color: var(--muted); font-variant-numeric: lining-nums; }
h1 { margin: 0; font-weight: 500; font-size: clamp(30px, 7vw, 56px); line-height: 1.05; letter-spacing: .03em; text-transform: uppercase;
     text-wrap: balance; }
.sub { margin: 12px 0 0; font-style: italic; color: var(--muted); }
.go { display: flex; gap: 14px; justify-content: center; margin: 40px 0 0; font-size: 17px; }
.go span { color: var(--soft); }
.go a { border-bottom: 1px solid transparent; }
.go a:hover { border-bottom-color: var(--ink); }
</style>
